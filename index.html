<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek NeoChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }

        /* 自定义美化滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }

        /* Markdown 样式精致化 */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.625; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body code {
            background-color: #1e293b;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875em;
            font-family: monospace;
            color: #f43f5e;
        }
        .markdown-body pre {
            background-color: #111827;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid #1f2937;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
            font-size: 0.875rem;
        }

        /* 思考动画 */
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center p-0 md:p-6 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 overflow-hidden">

    <div class="w-full max-w-6xl h-full md:h-[90vh] bg-slate-900/70 backdrop-blur-xl border border-slate-800 md:rounded-2xl shadow-2xl flex overflow-hidden">
        
        <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-slate-950/80 border-r border-slate-800/60 h-full transition-all flex-shrink-0">
            <div class="p-4 border-b border-slate-800/60">
                <button onclick="createNewSession()" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors flex items-center justify-center space-x-2 shadow-lg shadow-blue-900/20 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>开启新对话</span>
                </button>
            </div>
            <div id="sessionList" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar"></div>
            <div class="p-3 border-t border-slate-800/60 text-[10px] text-slate-500 text-center tracking-wider">
                最近聊天记录 (数据纯本地加密存储)
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-full overflow-hidden relative">
            
            <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800/60 bg-slate-900/40">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-1 text-slate-400 hover:text-slate-200 cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.6)]"></div>
                    <h1 class="text-lg font-semibold tracking-wide text-slate-200">DeepSeek <span class="text-blue-400 font-light">NeoChat</span></h1>
                </div>
                
                <div class="relative flex items-center">
                    <input type="password" id="apiKey" placeholder="输入 DeepSeek API Key" 
                           class="w-40 md:w-64 px-4 py-1.5 text-xs bg-slate-950/60 border border-slate-800 rounded-lg text-slate-300 placeholder-slate-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/30 transition-all"
                           onchange="saveApiKey()" />
                </div>
            </header>

            <main id="chatMessages" class="flex-1 p-6 overflow-y-auto space-y-6 custom-scrollbar bg-slate-900/10">
                </main>

            <footer class="p-4 md:p-6 border-t border-slate-800/60 bg-slate-900/30">
                <div class="max-w-3xl mx-auto relative flex items-end bg-slate-950/50 border border-slate-800/80 rounded-xl px-4 py-3 focus-within:border-blue-500/50 focus-within:ring-1 focus-within:ring-blue-500/20 transition-all shadow-inner">
                    <textarea id="userInput" placeholder="问点什么吧... (Enter 发送, Shift+Enter 换行)" rows="1"
                              class="flex-1 bg-transparent border-none outline-none resize-none text-sm text-slate-200 placeholder-slate-500 max-h-32 custom-scrollbar pr-12 py-1"
                              oninput="autoResize(this)"></textarea>
                    
                    <button id="sendBtn" onclick="sendMessage()" 
                            class="absolute right-3 bottom-3 p-2 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 text-white disabled:text-slate-600 rounded-lg transition-colors shadow-lg shadow-blue-900/20 cursor-pointer disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9-2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
                <div class="text-center text-[10px] text-slate-600 mt-2 tracking-wide">由 DeepSeek API 提供强力驱动 | 数据纯本地安全存储</div>
            </footer>
        </div>
    </div>

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-40"></div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const sessionList = document.getElementById('sessionList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        // 多会话管理状态数据结构
        let sessions = {}; 
        let currentSessionId = '';

        // 配置 Marked 支持同步流式实时渲染高亮
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // 页面初始化加载
        window.onload = function() {
            // 1. 读取保存的 API Key
            const savedKey = localStorage.getItem('deepseek_api_key');
            if (savedKey) { apiKeyInput.value = savedKey; }

            // 2. 加载本地存储的聊天记录
            const savedSessions = localStorage.getItem('neo_chat_sessions');
            if (savedSessions) {
                sessions = JSON.parse(savedSessions);
            }

            // 3. 渲染历史记录列表
            const sessionIds = Object.keys(sessions);
            if (sessionIds.length > 0) {
                renderSessionList();
                // 自动切入最近活跃更新过的那条聊天会话
                const lastActiveId = sessionIds.sort((a,b) => sessions[b].updatedAt - sessions[a].updatedAt)[0];
                switchSession(lastActiveId);
            } else {
                // 如果是新用户或者没有记录，自动建一个新对话
                createNewSession();
            }
        }

        function saveApiKey() {
            localStorage.setItem('deepseek_api_key', apiKeyInput.value.trim());
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight - 8, 128) + 'px';
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 手机端侧边栏显隐切换逻辑
        function toggleSidebar() {
            const isHidden = sidebar.classList.contains('hidden');
            if (isHidden) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('fixed', 'left-0', 'top-0', 'z-50', 'flex');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('fixed', 'left-0', 'top-0', 'z-50', 'flex');
                sidebarOverlay.classList.add('hidden');
            }
        }

        // 创建全新对话
        function createNewSession() {
            const id = 'session_' + Date.now();
            sessions[id] = {
                title: '新的对话',
                history: [],
                updatedAt: Date.now()
            };
            saveSessionsToStorage();
            renderSessionList();
            switchSession(id);
            
            // 手机端在建立新对话后，自动收起侧边栏菜单
            if (!sidebar.classList.contains('hidden') && window.innerWidth < 768) { toggleSidebar(); }
        }

        // 切换到目标对话
        function switchSession(id) {
            currentSessionId = id;
            chatMessages.innerHTML = '';
            
            // 刷新左侧会话列表的激活高亮 UI 状态
            document.querySelectorAll('.session-item').forEach(el => {
                el.classList.remove('bg-slate-800/80', 'text-blue-400');
                el.classList.add('text-slate-400', 'hover:bg-slate-800/40');
            });
            const activeEl = document.getElementById(`el_${id}`);
            if (activeEl) {
                activeEl.classList.remove('text-slate-400', 'hover:bg-slate-800/40');
                activeEl.classList.add('bg-slate-800/80', 'text-blue-400');
            }

            // 恢复渲染当前会话的所有历史消息
            const currentSession = sessions[id];
            if (currentSession.history.length === 0) {
                // 如果是空的新会话，展示系统欢迎语
                const welcomeBubble = createMessageElement('ai');
                welcomeBubble.innerHTML = `欢迎来到全新升级的对话界面。我已经修复了先前**脚本未定义**的组件引入故障，并加入了**最近聊天记录**侧边栏。请在右上角配置好 Key 后开启畅聊！`;
            } else {
                currentSession.history.forEach(msg => {
                    const bubble = createMessageElement(msg.role);
                    if (msg.role === 'user') {
                        bubble.innerText = msg.content;
                    } else {
                        bubble.innerHTML = marked.parse(msg.content);
                    }
                });
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 重新渲染左侧列表（支持删除与时间排序）
        function renderSessionList() {
            sessionList.innerHTML = '';
            // 按照最后活动更新时间倒序（最新聊天的在最上面）
            const sortedIds = Object.keys(sessions).sort((a,b) => sessions[b].updatedAt - sessions[a].updatedAt);
            
            sortedIds.forEach(id => {
                const session = sessions[id];
                const item = document.createElement('div');
                item.id = `el_${id}`;
                item.className = `session-item group flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium cursor-pointer transition-all mb-1 text-slate-400 hover:bg-slate-800/40`;
                
                // 会话文本点击项
                const textContainer = document.createElement('div');
                textContainer.className = 'flex items-center space-x-2.5 truncate w-full';
                textContainer.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 flex-shrink-0 text-slate-500 group-hover:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    <span class="truncate pr-1">${session.title}</span>
                `;
                textContainer.onclick = () => {
                    switchSession(id);
                    if (window.innerWidth < 768) { toggleSidebar(); } // 移动端点击后自动收起
                };
                
                // 悬浮显示的删除按钮
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'opacity-0 group-hover:opacity-100 p-0.5 hover:text-rose-400 rounded transition-opacity cursor-pointer';
                deleteBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-16v1a3 3 0 003 3h10M4 7h16" />
                    </svg>
                `;
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // 阻止触发外层切换会话事件
                    if(confirm('确定要删除这段对话吗？')) {
                        deleteSession(id);
                    }
                };
                
                item.appendChild(textContainer);
                item.appendChild(deleteBtn);
                sessionList.appendChild(item);
            });
        }

        function deleteSession(id) {
            delete sessions[id];
            saveSessionsToStorage();
            renderSessionList();
            
            const remainingIds = Object.keys(sessions);
            if (remainingIds.length > 0) {
                switchSession(remainingIds[0]);
            } else {
                createNewSession();
            }
        }

        function saveSessionsToStorage() {
            localStorage.setItem('neo_chat_sessions', JSON.stringify(sessions));
        }

        function createMessageElement(role) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-4 max-w-3xl ${role === 'user' ? 'ml-auto flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center shadow-md font-bold text-xs text-white ${
                role === 'user' ? 'bg-slate-700' : 'bg-gradient-to-tr from-blue-600 to-indigo-600'
            }`;
            avatar.innerText = role === 'user' ? 'ME' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = role === 'user' 
                ? 'bg-blue-600 border border-blue-500 text-white rounded-2xl rounded-tr-none px-4 py-3 text-sm shadow-sm leading-relaxed'
                : 'bg-slate-800/40 border border-slate-800/60 text-slate-200 rounded-2xl rounded-tl-none px-4 py-3 text-sm shadow-sm leading-relaxed markdown-body';

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            
            return bubble;
        }

        // 发送核心逻辑
        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim() || localStorage.getItem('deepseek_api_key');

            if (!text) return;
            if (!apiKey) { return alert('请先在顶部配置您的 DeepSeek API Key！'); }

            // 1. 用户消息上屏
            const userBubble = createMessageElement('user');
            userBubble.innerText = text;
            userInput.value = '';
            userInput.style.height = 'auto';

            // 2. 状态锁定并同步更新历史数据
            sendBtn.disabled = true;
            const currentSession = sessions[currentSessionId];
            currentSession.history.push({ role: "user", content: text });
            
            // 如果是初始新会话，自动将第一句话裁剪为该会话的历史缩略标题
            if (currentSession.title === '新的对话') {
                currentSession.title = text.length > 10 ? text.substring(0, 10) + '...' : text;
                renderSessionList();
            }
            currentSession.updatedAt = Date.now();
            saveSessionsToStorage();

            // 3. 思考状态占位
            const aiBubble = createMessageElement('ai');
            aiBubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // 4. 发送流式网络请求
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一个由 DeepSeek 驱动的高级 AI 助手，能够熟练运用 Markdown 格式和精美的代码块来回答问题。" },
                            ...currentSession.history
                        ],
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let aiReply = "";
                aiBubble.innerHTML = ""; 

                let buffer = ""; // 预防残包截断的数据流缓冲区

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // 预留未完结的末行

                    for (const line of lines) {
                        const cleanedLine = line.replace(/^data: /, "").trim();
                        if (!cleanedLine || cleanedLine === "[DONE]") continue;

                        try {
                            const parsed = JSON.parse(cleanedLine);
                            const content = parsed.choices[0].delta.content || "";
                            aiReply += content;
                            
                            // 渲染同步 Markdown（带有高亮）
                            aiBubble.innerHTML = marked.parse(aiReply);
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } catch (e) {
                            // 容错机制：忽略由于合并引起的不全数据流报错
                        }
                    }
                }

                // 数据接收完毕，对整体代码元素应用最终高亮检测
                aiBubble.querySelectorAll('pre code').forEach((el) => {
                    hljs.highlightElement(el);
                });

                // 将助手完整的回复存入本地历史记录
                currentSession.history.push({ role: "assistant", content: aiReply });
                currentSession.updatedAt = Date.now();
                saveSessionsToStorage();

            } catch (error) {
                console.error(error);
                aiBubble.innerHTML = `<span class="text-rose-400">错误: 无法获取 AI 回复。(${error.message})</span>`;
            } finally {
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
    </script>
</body>
</html>
