<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 聊天</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:80%;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    line-height:1.5;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.ai{
    background:#2a2a2a;
}

#input-area{
    display:flex;
    padding:15px;
    background:#1a1a1a;
}

input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2a2a2a;
    color:white;
    font-size:16px;
}

button{
    margin-left:10px;
    padding:15px 20px;
    border:none;
    border-radius:10px;
    background:#10a37f;
    color:white;
    font-size:16px;
}

</style>
</head>

<body>

<div id="chat">

<div class="message ai">
你好，我是 AI 助手 👋
</div>

</div>

<div id="input-area">

<input id="input" placeholder="输入消息...">

<button onclick="sendMessage()">
发送
</button>

</div>

<script>

function sendMessage(){

    let input = document.getElementById("input");

    let text = input.value;

    if(text.trim() === ""){
        return;
    }

    let chat = document.getElementById("chat");

    // 用户消息
    let userMessage = document.createElement("div");

    userMessage.className = "message user";

    userMessage.innerText = text;

    chat.appendChild(userMessage);

    // AI回复
    let aiMessage = document.createElement("div");

    aiMessage.className = "message ai";

    aiMessage.innerText = "你刚刚说的是：" + text;

    chat.appendChild(aiMessage);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
