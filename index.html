<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek AI Chat</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --chat-bg: #ffffff;
            --primary-color: #2f80ed;
            --text-color: #333333;
            --light-text: #666666;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部配置栏 */
        .chat-header {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .api-config {
            display: flex;
            gap: 10px;
        }

        .api-config input {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            width: 240px;
        }

        /* 消息展示区 */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.user {
            margin-left: auto;
            align-items: flex-end;
        }

        .message.ai {
            margin-right: auto;
            align-items: flex-start;
        }

        .message-content {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-all;
        }

        .user .message-content {
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai .message-content {
            background-color: #e9ecef;
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        /* 输入区 */
        .chat-input-area {
            padding: 15px 20px;
            background: #fff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input-area textarea {
            flex: 1;
            height: 44px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area textarea:focus {
            border-color: var(--primary-color);
        }

        .chat-input-area button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #1a66cc;
        }

        .chat-input-area button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- 头部导航及配置 -->
        <div class="chat-header">
            <h2>DeepSeek AI Assistant</h2>
            <div class="api-config">
                <!-- 增加了自动保存提示和监听事件 -->
                <input type="password" id="apiKey" placeholder="输入 Key 并回车/失焦自动保存" onchange="saveApiKey()" />
            </div>
        </div>

        <!-- 消息区域 -->
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-content">你好！我是你的 AI 助手。我已经支持记住 API Key 功能，首次输入后即可永久保存。</div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="chat-input-area">
            <textarea id="userInput" placeholder="输入消息，按下 Enter 发送..." rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');

        let messageHistory = [];

        // 页面加载时：自动读取本地存储的 API Key
        window.onload = function() {
            const savedKey = localStorage.getItem('deepseek_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                appendMessage('ai', '系统检测到已保存的 API Key，你可以直接开始对话了！');
            }
        }

        // 保存 API Key 到本地存储
        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            localStorage.setItem('deepseek_api_key', key);
        }

        // 监听回车键发送
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerText = text;
            
            msgDiv.appendChild(contentDiv);
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            // 优先从输入框拿，拿不到从本地存储拿
            const apiKey = apiKeyInput.value.trim() || localStorage.getItem('deepseek_api_key');

            if (!text) return;
            
            if (!apiKey) {
                alert('请先在顶部输入您的 DeepSeek API Key！');
                return;
            }

            appendMessage('user', text);
            userInput.value = '';
            
            sendBtn.disabled = true;
            sendBtn.innerText = '思考中...';

            messageHistory.push({ role: "user", content: text });

            appendMessage('ai', '正在思考...');
            const lastAiMessage = chatMessages.lastChild.querySelector('.message-content');

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一个乐于助人的 AI 助手。" },
                            ...messageHistory
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP 错误！状态码: ${response.status}`);
                }

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                lastAiMessage.innerText = aiReply;
                messageHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                console.error('API 请求失败:', error);
                lastAiMessage.innerText = `错误: 无法获取 AI 回复。(${error.message})`;
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = '发送';
            }
        }
    </script>
</body>
</html>
