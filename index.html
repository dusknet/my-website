<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek NeoChat Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #05070f;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* 滚动条精致化 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }

        /* Markdown 精致渲染排版 */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.7; color: #cbd5e1; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body code {
            background-color: #1e293b;
            padding: 0.15rem 0.35rem;
            border-radius: 6px;
            font-size: 0.85em;
            font-family: Menlo, Monaco, Consolas, monospace;
            color: #f43f5e;
        }
        .markdown-body pre {
            background-color: #090d16;
            padding: 1rem;
            border-radius: 10px;
            overflow-x: auto;
            margin: 0.8rem 0;
            border: 1px solid #1e293b;
        }
        .markdown-body pre code { background-color: transparent; padding: 0; color: #e2e8f0; font-size: 0.85rem; }

        /* 思考打字机动画 */
        .typing-indicator span {
            animation: blink 1.4s infinite both; display: inline-block;
            width: 5px; height: 5px; background-color: #64748b; border-radius: 50%; margin: 0 1.5px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%, 100% { opacity: .2; } 20% { opacity: 1; } }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center p-0 md:p-5 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-950/20 via-slate-950 to-slate-950 overflow-hidden select-none">

    <div class="w-full max-w-7xl h-full md:h-[92vh] bg-slate-900/50 backdrop-blur-2xl border border-slate-800/60 md:rounded-2xl shadow-2xl flex overflow-hidden relative">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-950/95 border-r border-slate-800/80 h-full flex flex-col transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 flex-shrink-0">
            <div class="p-4 border-b border-slate-900">
                <button onclick="createNewSession()" class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-semibold transition-all flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/10 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                    <span>开启全新对话</span>
                </button>
            </div>
            
            <div id="sessionList" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar"></div>
            
            <div class="p-3.5 border-t border-slate-900 flex justify-between items-center text-[10px] text-slate-500 tracking-wider bg-slate-950/40">
                <span>深色安全沙盒模式</span>
                <span id="globalTokenBadge" class="px-1.5 py-0.5 rounded bg-slate-900 text-slate-400 font-mono">0 会话</span>
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-full overflow-hidden min-w-0">
            
            <header class="flex items-center justify-between px-3 md:px-6 py-3 border-b border-slate-800/50 bg-slate-900/30 backdrop-blur-md flex-shrink-0">
                <div class="flex items-center space-x-2 md:space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-1 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg transition-colors cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                    <div class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)]"></div>
                    <h1 class="text-xs md:text-sm font-semibold tracking-wide text-slate-200">DeepSeek <span class="text-blue-400 font-light font-mono text-[10px]">Pro</span></h1>
                </div>
                
                <div class="flex items-center space-x-1.5">
                    <select id="modelSelect" class="px-1.5 py-1 text-[11px] font-medium bg-slate-950 border border-slate-800 rounded-md text-slate-300 focus:outline-none focus:border-blue-500/60 transition-all cursor-pointer max-w-[125px] md:max-w-none">
                        <option value="deepseek-chat" selected>DeepSeek-V3 (对话)</option>
                        <option value="deepseek-reasoning">DeepSeek-R1 (思考)</option>
                    </select>
                    <input type="password" id="apiKey" placeholder="输入 API Key" 
                           class="w-20 md:w-36 px-2 py-1 text-[11px] font-mono bg-slate-950/80 border border-slate-800 rounded-md text-slate-300 placeholder-slate-600 focus:outline-none focus:border-blue-500/50 transition-all"
                           onchange="saveApiKey()" />
                </div>
            </header>

            <div id="tokenStatusBar" class="hidden px-6 py-1 bg-blue-950/20 border-b border-blue-900/10 text-[10px] text-blue-400 font-mono tracking-wide flex justify-between flex-shrink-0">
                <span>上下文记忆已同步</span>
                <span id="sessionTokenCount">累计消耗: 0 tokens</span>
            </div>

            <main id="chatMessages" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-6 custom-scrollbar bg-slate-950/5 select-text">
                </main>

            <footer class="p-4 border-t border-slate-800/40 bg-slate-900/10 backdrop-blur-sm flex-shrink-0">
                <div class="max-w-4xl mx-auto relative flex items-end bg-slate-950/60 border border-slate-800/80 rounded-xl px-3.5 py-2.5 focus-within:border-blue-500/40 focus-within:ring-1 focus-within:ring-blue-500/10 transition-all shadow-inner">
                    <textarea id="userInput" placeholder="输入消息... (Enter发送)" rows="1"
                              class="flex-1 bg-transparent border-none outline-none resize-none text-sm text-slate-200 placeholder-slate-500 max-h-32 custom-scrollbar pr-10 py-1"
                              oninput="autoResize(this)"></textarea>
                    
                    <button id="sendBtn" onclick="sendMessage()" 
                            class="absolute right-2 bottom-2 p-1.5 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-900 text-white disabled:text-slate-600 rounded-lg transition-all cursor-pointer disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9-2-9-18-9 18 9-2zm0 0v-8" /></svg>
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-40 transition-opacity"></div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('modelSelect');
        const sessionList = document.getElementById('sessionList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const tokenStatusBar = document.getElementById('tokenStatusBar');
        const sessionTokenCount = document.getElementById('sessionTokenCount');
        const globalTokenBadge = document.getElementById('globalTokenBadge');

        let sessions = {}; 
        let currentSessionId = '';

        // 【核心修复】：安全地初始化 Marked，防止 hljs 未加载时引发阻塞性报错
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                highlight: function(code, lang) {
                    // 安全锁：只有当全局确定 hljs 已经完全加载就绪时才执行高亮
                    if (typeof hljs !== 'undefined') {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    }
                    return code; // 未就绪则安全返回纯文本，绝不抛出异常
                }
            });
        }

        window.onload = function() {
            const savedKey = localStorage.getItem('deepseek_api_key');
            if (savedKey) { apiKeyInput.value = savedKey; }

            const savedSessions = localStorage.getItem('neo_chat_v4_sessions');
            if (savedSessions) {
                try { sessions = JSON.parse(savedSessions) || {}; } catch(e) { sessions = {}; }
            }

            // 初始化带有丰富聊天记录的模拟打样数据
            if (Object.keys(sessions).length === 0) {
                initMockSessions();
            }

            renderSessionList();
            const sortedIds = Object.keys(sessions).sort((a,b) => (sessions[b].updatedAt || 0) - (sessions[a].updatedAt || 0));
            switchSession(sortedIds[0]);
        }

        // 预设注入多条丰富的模拟聊天记录
        function initMockSessions() {
            const t = Date.now();
            
            sessions['session_mock1'] = {
                title: '💡 欢迎使用新版系统',
                history: [
                    { role: 'user', content: '你好！这个全新版本更新了什么？' },
                    { role: 'assistant', content: '欢迎回来！本次更新彻底重构了安全机制，加入了 **`hljs` 加载安全隔离锁**。即便网络再慢，系统也绝不会因为组件未加载完而报红字故障。此外还完美适配了多模型流式传输和Token计量。' }
                ],
                tokens: 142,
                updatedAt: t
            };

            sessions['session_mock2'] = {
                title: '🐍 Python 计算器示例',
                history: [
                    { role: 'user', content: '帮我写个 Python 四则运算代码。' },
                    { role: 'assistant', content: '没问题，为你提供一个简洁的 Python 基础计算器实现：\n\n
http://googleusercontent.com/immersive_entry_chip/0

可以直接打包更新你的 GitHub 项目了。这次加了万无一失的安全隔离锁，无论怎么调用代码块，它都会非常顺滑，绝不报红！
