<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jack AI</title>

<style>

body{

background:#0f0f0f;
margin:0;
font-family:sans-serif;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.chat-box{

width:95%;
max-width:700px;
height:95vh;

background:#181818;

border-radius:20px;

display:flex;
flex-direction:column;

overflow:hidden;

box-shadow:
0 0 20px rgba(0,255,200,0.2);

}

.header{

padding:18px;

background:#111;

color:#00ffcc;

font-size:22px;
font-weight:bold;

text-align:center;

border-bottom:
1px solid #333;

}

.messages{

flex:1;

padding:15px;

overflow-y:auto;

display:flex;
flex-direction:column;

gap:12px;

}

.message{

max-width:80%;

padding:12px 16px;

border-radius:16px;

line-height:1.5;

word-break:break-all;

animation:show 0.2s ease;

}

.user{

align-self:flex-end;

background:#00ffcc;

color:#000;

}

.ai{

align-self:flex-start;

background:#2a2a2a;

color:white;

}

.input-area{

display:flex;

padding:12px;

background:#111;

border-top:
1px solid #333;

}

input{

flex:1;

padding:14px;

border:none;

outline:none;

border-radius:12px;

background:#222;

color:white;

font-size:16px;

}

button{

margin-left:10px;

padding:0 20px;

border:none;

border-radius:12px;

background:#00ffcc;

color:black;

font-weight:bold;

font-size:16px;

}

button:active{

transform:scale(0.96);

}

@keyframes show{

from{

opacity:0;
transform:translateY(10px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>
</head>

<body>

<div class="chat-box">

<div class="header">
🤖 Jack AI
</div>

<div class="messages"
id="messages">

<div class="message ai">
你好，我是 AI 助手 👋
</div>

</div>

<div class="input-area">

<input
id="input"
placeholder="输入消息...">

<button onclick="sendMessage()">
发送
</button>

</div>

</div>

<script>

function sendMessage(){

const input =
document.getElementById("input");

const text = input.value;

if(text.trim() === "")
return;

const messages =
document.getElementById("messages");

const userMessage =
document.createElement("div");

userMessage.className =
"message user";

userMessage.innerText =
text;

messages.appendChild(userMessage);

input.value = "";

messages.scrollTop =
messages.scrollHeight;

setTimeout(()=>{

const aiMessage =
document.createElement("div");

aiMessage.className =
"message ai";

aiMessage.innerText =
"你刚刚说的是：" + text;

messages.appendChild(aiMessage);

messages.scrollTop =
messages.scrollHeight;

},600);

}

</script>

</body>
</html>
