<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek NeoChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/languages/bash.min.js"></script>
    <style>
        /* 引入精致的现代字体 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }

        /* 隐藏原生滚动条，美化滚动体验 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }

        /* AI 回复中的 Markdown 样式精致化 */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.625; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body code {
            background-color: #1e293b;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875em;
            font-family: monospace;
            color: #f43f5e;
        }
        .markdown-body pre {
            background-color: #111827;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid #1f2937;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
            font-size: 0.875rem;
        }

        /* 思考中的动画 */
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center p-0 md:p-6 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950">

    <div class="w-full max-w-5xl h-full md:h-[90vh] bg-slate-900/70 backdrop-blur-xl border border-slate-800 md:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        
        <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800/60 bg-slate-900/40">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.6)]"></div>
                <h1 class="text-lg font-semibold tracking-wide text-slate-200">DeepSeek <span class="text-blue-400 font-light">NeoChat</span></h1>
            </div>
            
            <div class="relative flex items-center">
                <input type="password" id="apiKey" placeholder="输入 DeepSeek API Key" 
                       class="w-48 md:w-64 px-4 py-1.5 text-xs bg-slate-950/60 border border-slate-800 rounded-lg text-slate-300 placeholder-slate-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/30 transition-all"
                       onchange="saveApiKey()" />
            </div>
        </header>

        <main id="chatMessages" class="flex-1 p-6 overflow-y-auto space-y-6 custom-scrollbar">
            <div class="flex items-start space-x-4 max-w-3xl">
                <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md">
                    <span class="text-xs font-bold text-white">AI</span>
                </div>
                <div class="bg-slate-800/40 border border-slate-800/60 rounded-2xl rounded-tl-none px-4 py-3 text-sm text-slate-300 shadow-sm leading-relaxed">
                    欢迎来到全新升级的对话界面。我已经启用了**流式逐字响应**与**代码美化排版**。请在右上角配置好 Key 后开启畅聊！
                </div>
            </div>
        </main>

        <footer class="p-4 md:p-6 border-t border-slate-800/60 bg-slate-900/30">
            <div class="max-w-3xl mx-auto relative flex items-end bg-slate-950/50 border border-slate-800/80 rounded-xl px-4 py-3 focus-within:border-blue-500/50 focus-within:ring-1 focus-within:ring-blue-500/20 transition-all shadow-inner">
                <textarea id="userInput" placeholder="问点什么吧... (Enter 发送, Shift+Enter 换行)" rows="1"
                          class="flex-1 bg-transparent border-none outline-none resize-none text-sm text-slate-200 placeholder-slate-500 max-h-32 custom-scrollbar pr-12 py-1"
                          oninput="autoResize(this)"></textarea>
                
                <button id="sendBtn" onclick="sendMessage()" 
                        class="absolute right-3 bottom-3 p-2 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 text-white disabled:text-slate-600 rounded-lg transition-colors shadow-lg shadow-blue-900/20 cursor-pointer disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9-2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
            <div class="text-center text-[10px] text-slate-600 mt-2 tracking-wide">由 DeepSeek API 提供强力驱动 | 数据纯本地安全存储</div>
        </footer>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');

        let messageHistory = [];

        // 配置 Marked 选项
        marked.setOptions({
            highlight: function(code, lang) {
                return hljs.highlightAuto(code).value;
            }
        });

        // 自动读取 Key
        window.onload = function() {
            const savedKey = localStorage.getItem('deepseek_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        }

        function saveApiKey() {
            localStorage.setItem('deepseek_api_key', apiKeyInput.value.trim());
        }

        // 输入框高度自适应
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight - 8, 128) + 'px';
        }

        // 监听回车
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 核心：创建一条渲染消息的基本结构
        function createMessageElement(role) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-4 max-w-3xl ${role === 'user' ? 'ml-auto flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center shadow-md font-bold text-xs text-white ${
                role === 'user' ? 'bg-slate-700' : 'bg-gradient-to-tr from-blue-600 to-indigo-600'
            }`;
            avatar.innerText = role === 'user' ? 'ME' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = role === 'user' 
                ? 'bg-blue-600 border border-blue-500 text-white rounded-2xl rounded-tr-none px-4 py-3 text-sm shadow-sm leading-relaxed'
                : 'bg-slate-800/40 border border-slate-800/60 text-slate-200 rounded-2xl rounded-tl-none px-4 py-3 text-sm shadow-sm leading-relaxed markdown-body';

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            
            return bubble;
        }

        // 发送消息与流式响应逻辑
        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim() || localStorage.getItem('deepseek_api_key');

            if (!text) return;
            if (!apiKey) { return alert('请先在顶部配置您的 DeepSeek API Key！'); }

            // 1. 用户消息上屏
            const userBubble = createMessageElement('user');
            userBubble.innerText = text;
            userInput.value = '';
            userInput.style.height = 'auto';

            // 2. 禁用发送状态
            sendBtn.disabled = true;
            messageHistory.push({ role: "user", content: text });

            // 3. AI 思考中动画占位
            const aiBubble = createMessageElement('ai');
            aiBubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // 4. 调用 DeepSeek API 并开启 stream: true
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一个由 DeepSeek 驱动的高级 AI 助手，能够熟练运用 Markdown 格式和精美的代码块来回答问题。" },
                            ...messageHistory
                        ],
                        stream: true // 开启流式传输！
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                // 5. 解析流式数据 (Stream Reader)
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let aiReply = "";
                aiBubble.innerHTML = ""; // 移除思考动画

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    // API 返回的数据是以 "data: {...}" 形式隔开的多行字符串
                    const lines = chunk.split("\n");
                    
                    for (const line of lines) {
                        const cleanedLine = line.replace(/^data: /, "").trim();
                        if (!cleanedLine || cleanedLine === "[DONE]") continue;

                        try {
                            const parsed = JSON.parse(cleanedLine);
                            const content = parsed.choices[0].delta.content || "";
                            aiReply += content;
                            
                            // 实时渲染 Markdown
                            aiBubble.innerHTML = marked.parse(aiReply);
                            // 实时滚动到底部
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } catch (e) {
                            // 忽略部分解析不全的特殊行
                        }
                    }
                }

                // 6. 完结后，对最终所有的代码块进行语法高亮
                aiBubble.querySelectorAll('pre code').forEach((el) => {
                    hljs.highlightElement(el);
                });

                messageHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                console.error(error);
                aiBubble.innerHTML = `<span class="text-rose-400">错误: 无法获取 AI 回复。(${error.message})</span>`;
            } finally {
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
    </script>
</body>
</html>
