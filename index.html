<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek NeoChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* 自定义美化滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }

        /* Markdown 样式精致化 */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.625; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body code {
            background-color: #1e293b;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875em;
            font-family: monospace;
            color: #f43f5e;
        }
        .markdown-body pre {
            background-color: #111827;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid #1f2937;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
            font-size: 0.875rem;
        }

        /* 思考动画 */
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body class="h-dvh w-screen flex justify-center items-center p-0 md:p-6 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 overflow-hidden position-fixed inset-0">

    <div class="w-full max-w-6xl h-full md:h-[90vh] bg-slate-900/70 backdrop-blur-xl border border-slate-800 md:rounded-2xl shadow-2xl flex overflow-hidden">
        
        <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-slate-950/95 border-r border-slate-800/60 h-full transition-all flex-shrink-0 z-50">
            <div class="p-4 border-b border-slate-800/60">
                <button onclick="createNewSession()" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors flex items-center justify-center space-x-2 shadow-lg shadow-blue-900/20 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>开启新对话</span>
                </button>
            </div>
            <div id="sessionList" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar"></div>
            <div class="p-3 border-t border-slate-800/60 text-[10px] text-slate-500 text-center tracking-wider">
                最近聊天记录 (数据纯本地安全存储)
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-full overflow-hidden relative">
            
            <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800/60 bg-slate-900/40 z-10">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-1 text-slate-400 hover:text-slate-200 cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.6)]"></div>
                    <h1 class="text-lg font-semibold tracking-wide text-slate-200">DeepSeek <span class="text-blue-400 font-light">NeoChat</span></h1>
                </div>
                
                <div class="relative flex items-center">
                    <input type="password" id="apiKey" placeholder="输入 Key" 
                           class="w-32 md:w-64 px-3 py-1.5 text-xs bg-slate-950/60 border border-slate-800 rounded-lg text-slate-300 placeholder-slate-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/30 transition-all"
                           onchange="saveApiKey()" />
                </div>
            </header>

            <main id="chatMessages" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-6 custom-scrollbar bg-slate-900/10 pb-24 md:pb-6">
                </main>

            <footer class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent md:relative md:bg-slate-900/30 border-t md:border-t border-slate-800/60 z-20">
                <div class="max-w-3xl mx-auto relative flex items-end bg-slate-950 border border-slate-800/80 rounded-xl px-4 py-2.5 focus-within:border-blue-500/50 focus-within:ring-1 focus-within:ring-blue-500/20 transition-all shadow-inner">
                    <textarea id="userInput" placeholder="问点什么吧..." rows="1"
                              class="flex-1 bg-transparent border-none outline-none resize-none text-sm text-slate-200 placeholder-slate-500 max-h-32 custom-scrollbar pr-12 py-1"
                              oninput="autoResize(this)"></textarea>
                    
                    <button id="sendBtn" onclick="sendMessage()" 
                            class="absolute right-3 bottom-2.5 p-2 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 text-white disabled:text-slate-600 rounded-lg transition-colors shadow-lg shadow-blue-900/20 cursor-pointer disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4
